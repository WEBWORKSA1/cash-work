name: Auto-refresh content

on:
  schedule:
    - cron: "17 */6 * * *"   # every six hours
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "build.py"
      - "scripts/**"
      - "data/gigs.json"
      - ".github/workflows/refresh.yml"

permissions:
  contents: write

concurrency:
  group: refresh-content
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Fetch jobs, videos and news
        run: python3 scripts/fetch_data.py

      - name: Rebuild pages and sitemap
        run: python3 build.py

      - name: Commit and push changes
        run: |
          git config user.name "cash-work-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data *.html tools guides sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Auto-refresh: jobs, videos and news ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
