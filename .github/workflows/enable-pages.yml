name: Enable GitHub Pages (main branch)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/enable-pages.yml"

permissions:
  pages: write
  contents: read

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Turn on Pages from main (root) if it is off
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "Pages already enabled:"; gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.html_url, .source'
            exit 0
          fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages" \
            -f build_type=legacy -f 'source[branch]=main' -f 'source[path]=/' \
            && echo "Pages enabled." \
            || { echo "::warning::This token cannot enable Pages. Open Settings > Pages, choose 'Deploy from a branch', branch main, folder / (root), and save."; exit 0; }
